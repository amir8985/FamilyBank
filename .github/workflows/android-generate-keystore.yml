name: Android - Generate signing keystore (run ONCE)

# This creates the ONE signing key every future Play Store update must be
# signed with. Run it exactly once, ever, for this app. Re-running it
# would generate a NEW key and orphan every build signed with the old
# one — Play Store requires the same signing identity for every update
# to an existing listing. Once you've saved the artifact from this run
# as GitHub secrets (see android/README.md), there's no reason to run
# this workflow again.
on:
  workflow_dispatch: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -keystore android-release.keystore \
            -storepass "${{ secrets.KEYSTORE_BOOTSTRAP_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_BOOTSTRAP_PASSWORD }}" \
            -dname "CN=FamilyBank, OU=FamilyBank, O=FamilyBank, L=, ST=, C=PT"

      - name: Print SHA-256 fingerprint (needed for assetlinks.json)
        run: |
          keytool -list -v \
            -keystore android-release.keystore \
            -storepass "${{ secrets.KEYSTORE_BOOTSTRAP_PASSWORD }}" \
            | grep "SHA256:"

      - name: Upload keystore as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-keystore
          path: android-release.keystore
          retention-days: 7

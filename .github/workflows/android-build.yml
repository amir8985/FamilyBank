name: Android - Build signed .aab

# Manual only — this isn't part of the normal web deploy pipeline
# (pushing to master already deploys the website via Vercel/Render).
# Run this on demand whenever you want a new Play Store build.
#
# Bubblewrap's CLI is interactive by default and was never dry-run
# end-to-end before this workflow's first real use (no local JDK/Android
# SDK exist in the dev environment this was written in) — both `init`
# and `build` can prompt with a (Y/n) question the first time they run
# in a fresh environment. Two real failures hit and fixed so far
# (2026-09-06):
#   1. `build` hung forever on "install the Android SDK?" with no input
#      piped to it (killed after ~2min, exit 130) — fixed by piping
#      `yes ""` (accept every bracketed default) into it.
#   2. Answering "yes, install the SDK" led bubblewrap to try
#      downloading its own copy, which failed with "Terms and
#      Conditions was not signed" — Android's SDK licenses need an
#      explicit "y", which a blank/Enter answer doesn't satisfy, and
#      it kept re-prompting into a wall of blank lines until it gave up.
#      Fixed by accepting all SDK licenses on the SDK `setup-android`
#      already installed, then telling bubblewrap to use *that* SDK
#      (answer "n" to "install the Android SDK?") instead of trying to
#      fetch and license its own.
#   3. Answering "n" then leads to a free-text "Path to your existing
#      Android SDK:" prompt — a blank answer isn't accepted there (it's
#      not a bracketed-default question like the others), so it looped
#      "The provided androidSdk isn't correct" forever. Fixed by piping
#      the real path ($ANDROID_HOME, set by setup-android) as the answer.
# If a *different* prompt shows up later that this doesn't cover, the
# fix is the same pattern: pipe an answer to it.
on:
  workflow_dispatch: {}

env:
  PWA_URL: https://family-bank-nine.vercel.app
  PACKAGE_ID: com.familybank.app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        # Required before downloading any SDK platform/build-tools
        # package non-interactively — a blank/Enter answer does NOT
        # count as accepting, each license needs a literal "y".
        run: yes | sdkmanager --licenses || true

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android-release.keystore

      - name: Scaffold TWA project (first run only — reuses android/ if it already exists)
        working-directory: android
        run: |
          if [ ! -f twa-manifest.json ]; then
            yes "" | bubblewrap init \
              --manifest="${{ env.PWA_URL }}/manifest.webmanifest" \
              --directory=. || true
          fi

      - name: Build signed app bundle
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # "n" = use the SDK already installed/licensed above, don't
          # let bubblewrap fetch its own. It then asks for the SDK's
          # path as free text — a blank answer isn't accepted there
          # (unlike the (Y/n) questions), so it must get a real path;
          # $ANDROID_HOME is what android-actions/setup-android set.
          # Anything after that gets blank answers for any remaining
          # defaults.
          { echo "n"; echo "$ANDROID_HOME"; yes ""; } | bubblewrap build \
            --signingKeyPath=../android-release.keystore \
            --signingKeyAlias=upload

      - name: Upload signed .aab
        uses: actions/upload-artifact@v4
        with:
          name: familybank-release
          path: android/app-release-bundle.aab

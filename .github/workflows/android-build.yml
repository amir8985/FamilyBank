name: Android - Build signed .aab

# Manual only — this isn't part of the normal web deploy pipeline
# (pushing to master already deploys the website via Vercel/Render).
# Run this on demand whenever you want a new Play Store build.
#
# Bubblewrap's CLI is interactive by default and was never dry-run
# end-to-end before this workflow's first real use (no local JDK/Android
# SDK exist in the dev environment this was written in) — both `init`
# and `build` can prompt with a (Y/n) question the first time they run
# in a fresh environment (e.g. "install the Android SDK?"), which hangs
# forever with no input piped to it. Confirmed on 2026-09-06: `build`
# hit exactly this and was killed after hanging (exit 130) — fixed by
# piping `yes ""` (accept every default) into both commands. If a
# *different* prompt shows up later that this doesn't cover, the fix is
# the same pattern: pipe an answer to it.
on:
  workflow_dispatch: {}

env:
  PWA_URL: https://family-bank-nine.vercel.app
  PACKAGE_ID: com.familybank.app

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android-release.keystore

      - name: Scaffold TWA project (first run only — reuses android/ if it already exists)
        working-directory: android
        run: |
          if [ ! -f twa-manifest.json ]; then
            yes "" | bubblewrap init \
              --manifest="${{ env.PWA_URL }}/manifest.webmanifest" \
              --directory=. || true
          fi

      - name: Build signed app bundle
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          yes "" | bubblewrap build \
            --signingKeyPath=../android-release.keystore \
            --signingKeyAlias=upload

      - name: Upload signed .aab
        uses: actions/upload-artifact@v4
        with:
          name: familybank-release
          path: android/app-release-bundle.aab

services:
  - type: web
    name: familybank-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    # request.client.host (used by the per-IP rate limit on
    # /internal/client-metrics — see app/core/rate_limit.py) needs to see
    # the real visitor, not Render's own edge proxy, which always sits in
    # front. --proxy-headers alone doesn't get there: it's already
    # uvicorn's default, and the flag that actually matters —
    # --forwarded-allow-ips — defaults to "127.0.0.1" ("trust
    # X-Forwarded-For only from a proxy connecting via loopback"). Render's
    # edge proxy reaches this container over the network, not 127.0.0.1,
    # so left at the default, request.client.host would have kept reading
    # as the proxy's own address for every request — one shared rate-limit
    # bucket for every real visitor, with no error to surface it.
    # --forwarded-allow-ips='*' trusts the header from any immediate peer,
    # which is safe specifically because Render's proxy is the only thing
    # that can open a direct connection to this process at all.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      # Set these in the Render dashboard after the first deploy — never
      # commit real values here. See backend/.env.example for what each
      # one means and how to generate the random-secret ones.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: BACKEND_JWT_SECRET
        sync: false
      - key: INTERNAL_SCHEDULER_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: DEFAULT_BASE_CURRENCY
        value: USD
      # This process is long-running on Render (unlike Vercel's
      # serverless functions), so the in-process scheduler is the right
      # mechanism here — no external cron needed.
      # NOTE: the planned Cloud Run migration (docs/cloud-run-migration.md)
      # sets this to "false" and drives the refresh from Cloud Scheduler →
      # POST /internal/refresh instead. Keep it "true" here for as long as
      # Render is the live backend; the advisory lock in run_refresh()
      # makes a brief overlap between the two harmless.
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_HOURS
        value: "5"
      # Never set this to true in production.
      - key: DEV_MODE
        value: "false"
